<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="resumen">
  <div class="login-container">
    <h2>Panel Principal</h2>
    <p id="bienvenida"></p>

    <div class="acciones">
      <a href="resumen.html">
        <img src="https://cdn-icons-png.flaticon.com/512/2099/2099192.png" class="icono-link" />Resumen</a>

      <a href="historial.html">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828911.png" class="icono-link" />Historial</a>

      <a href="#" onclick="cerrarSesion()">
        <img src="https://cdn-icons-png.flaticon.com/512/1828/1828479.png" class="icono-link" />Cerrar sesión</a>
    </div>
  </div>

  <script>
    // Verificar si hay sesión activa
    const usuarioId = localStorage.getItem("usuario_id");
    const rol = localStorage.getItem("rol");

    if (!usuarioId || !rol) {
      alert("Acceso no autorizado. Inicia sesión primero.");
      window.location.href = "index.html";
    } else {
      const bienvenida = document.getElementById("bienvenida");
      bienvenida.innerText = `Bienvenido (${rol})`;  // ejemplo: Bienvenido (admin)
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
